services:
  postgres:
    image: docker.io/postgres:16.3-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      # Persistance via Named Volume géré par Podman (performances maximales sur SSD interne)
      - postgres_data:/var/lib/postgresql/data
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true

volumes:
  postgres_data: