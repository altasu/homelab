# ⚠️ OBSOLÈTE — conservé à titre historique et comme solution de repli.
# L'orchestration est assurée par les unités Quadlet de infra/quadlet/.
# Voir docs/quadlet-migration-plan.md.

services:
  cloudflared:
    image: docker.io/cloudflare/cloudflared:2026.6.0
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}
    networks:
      - homelab_net

  twingate-connector:
    image: docker.io/twingate/connector:1.92.0
    container_name: twingate-connector
    restart: unless-stopped
    environment:
      - TWINGATE_NETWORK=${TWINGATE_NETWORK}
      - TWINGATE_ACCESS_TOKEN=${TWINGATE_ACCESS_TOKEN}
      - TWINGATE_REFRESH_TOKEN=${TWINGATE_REFRESH_TOKEN}
    networks:
      homelab_net:
        ipv4_address: 10.89.0.100


networks:
  homelab_net:
    external: true