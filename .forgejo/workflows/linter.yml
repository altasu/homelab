name: Homelab CI Validation

on:
  push:
    branches:
      - '**' # S'exécute sur toutes les branches

jobs:
  validate-architecture:
    runs-on: docker # Utilise le label 'docker' que nous avons configuré
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check scripts syntax (ShellCheck)
        uses: github.com/ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

      - name: Verify Architecture Rules (.env.example presence)
        run: |
          echo "Vérification de la présence des fichiers .env.example..."
          MISSING=0
          
          # 1. Vérification des projets docker-compose
          for compose_file in $(find . -type f -name "compose.yml"); do
            dir=$(dirname "$compose_file")
            if [ ! -f "$dir/.env.example" ]; then
              echo "❌ ERREUR : Le dossier $dir contient un compose.yml mais aucun .env.example !"
              MISSING=1
            fi
          done
          
          # 2. Vérification des unités Quadlet
          for container_file in $(find . -type f -name "*.container"); do
            service_name=$(basename "$container_file" .container)
            quadlet_dir=$(dirname "$container_file")
            level_dir=$(dirname "$quadlet_dir")
            
            # On cherche <service>.env.example ou un .env.example générique au niveau parent
            if [ ! -f "$level_dir/${service_name}.env.example" ] && [ ! -f "$level_dir/.env.example" ]; then
              echo "❌ ERREUR : L'unité Quadlet '$service_name' dans $level_dir n'a pas de fichier .env.example associé !"
              MISSING=1
            fi
          done
          
          if [ $MISSING -eq 1 ]; then
            echo "Validation échouée : respectez les règles d'architecture Zero Trust."
            exit 1
          else
            echo "✅ Tous les dossiers de déploiement possèdent un .env.example."
          fi

  validate-docs:
    runs-on: docker
    container: python:3.13-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: pip install --no-cache-dir mkdocs-material==9.7.7
        
      - name: Check Documentation Build (Strict)
        run: mkdocs build --strict
