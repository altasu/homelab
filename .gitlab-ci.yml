# Publication automatique de la documentation via GitLab Pages.
# Aucune ressource du serveur homelab n'est utilisée : la construction du
# site s'exécute sur les runners GitLab, à chaque poussée sur main.

stages:
  - test
  - deploy

validate-architecture:
  stage: test
  image: alpine:latest
  script:
    - apk add --no-cache bash
    - |
      echo "Vérification de la présence des fichiers .env.example..."
      MISSING=0
      
      # Recherche tous les dossiers contenant un compose.yml OU un fichier .container (Quadlet)
      for dir in $(find . -type f \( -name "compose.yml" -o -name "*.container" \) -exec dirname {} \; | sort -u); do
        if [ ! -f "$dir/.env.example" ]; then
          echo "❌ ERREUR : Le dossier $dir contient un fichier de déploiement (compose.yml ou .container) mais aucun fichier .env.example !"
          MISSING=1
        fi
      done
      
      if [ $MISSING -eq 1 ]; then
        echo "Validation échouée : respectez les règles d'architecture Zero Trust."
        exit 1
      else
        echo "✅ Tous les dossiers de déploiement possèdent un .env.example."
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  image: python:3.13-slim
  stage: deploy
  script:
    - pip install --no-cache-dir mkdocs-material==9.7.7
    # --strict : échoue sur tout lien mort ou avertissement, plutôt que de
    # publier silencieusement un site cassé.
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"