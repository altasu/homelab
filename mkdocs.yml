site_name: Homelab — Infrastructure as Code
site_url: https://altasu.gitlab.io/homelab/
site_description: Migration d'un homelab Podman rootless vers Quadlet, documentée de bout en bout.
repo_url: https://gitlab.com/altasu/homelab
repo_name: altasu/homelab

theme:
  name: material
  language: fr
  palette:
    scheme: slate
    primary: teal
  features:
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/altasu/homelab

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: fr
          default: true
          name: Français
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Accueil: Home
            Architecture: Architecture
            "Plan de migration Quadlet": "Quadlet Migration Plan"
            Runbooks: Runbooks
            "Sauvegardes : vérification et restauration": "Backups: verification and restoration"
            "Pilote : Actual Budget": "Pilot: Actual Budget"
            "Bascule : Vaultwarden": "Cutover: Vaultwarden"
            "Bascule : PostgreSQL": "Cutover: PostgreSQL"
            "Bascule : Infra (tunnels)": "Cutover: Infra (tunnels)"
            Observabilité: Observability

nav:
  - Accueil: index.md
  - Architecture: architecture.md
  - Plan de migration Quadlet: quadlet-migration-plan.md
  - Runbooks:
      - "Sauvegardes : vérification et restauration": runbooks/sauvegardes-verification-restauration.md
      - "Pilote : Actual Budget": runbooks/quadlet-pilote-actual-budget.md
      - "Bascule : Vaultwarden": runbooks/quadlet-bascule-vaultwarden.md
      - "Bascule : PostgreSQL": runbooks/quadlet-bascule-postgres.md
      - "Bascule : Infra (tunnels)": runbooks/quadlet-bascule-infra.md
      - Observabilité: runbooks/observabilite.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true