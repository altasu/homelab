# Provisionnement Grafana : point de contact et politique de notification
#
# Le jeton d'accès ntfy n'est PAS écrit ici : il est lu depuis une variable
# d'environnement du conteneur Grafana (`NTFY_TOKEN`, défini dans
# apps/grafana.env, non versionné). Le dépôt reste ainsi exempt de secret.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy-homelab
        type: webhook
        settings:
          # Grafana émet toujours un corps JSON complet. Sans mise en forme,
          # la notification affiche ce bloc brut, illisible sur un téléphone.
          # ntfy fournit un template prédéfini qui sait analyser le payload
          # webhook de Grafana (titre, message, état firing/resolved) —
          # approche recommandée par ntfy lorsqu'on contrôle le serveur,
          # plus robuste que le templating générique par requête (tpl=yes)
          # essayé initialement et resté sans effet.
          url: "http://ntfy:80/homelab?template=grafana"
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $__env{NTFY_TOKEN}

policies:
  - orgId: 1
    receiver: ntfy
    group_by:
      - alertname
    # Regroupement volontairement espacé : ces alertes portent sur des états
    # durables (sauvegarde absente, disque plein), pas sur des incidents
    # transitoires — inutile de multiplier les notifications.
    group_wait: 1m
    group_interval: 10m
    repeat_interval: 12h
