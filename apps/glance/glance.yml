# Configuration du Dashboard Homelab (Glance)
# Documentation : https://github.com/glanceapp/glance

theme:
  background-color: 220 15 13
  primary-color: 175 60 45

pages:
  - name: Homelab
    columns:
      # Colonne 1 : Navigation & Services Applicatifs
      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Applications
                links:
                  - title: Vaultwarden
                    url: ${URL_VAULTWARDEN}
                    description: Gestionnaire de mots de passe
                  - title: Actual Budget
                    url: ${URL_ACTUAL_BUDGET}
                    description: Gestion financière personnelle
                  - title: Forgejo
                    url: ${URL_FORGEJO}
                    description: Dépôts Git & CI/CD
              - title: Administration & Système
                links:
                  - title: Cockpit
                    url: ${URL_COCKPIT}
                    description: Console de gestion hôte
                  - title: Windows 11
                    url: ${URL_WINDOWS}
                    description: Machine virtuelle KVM

      # Colonne 2 : Surveillance & Statut en Direct
      - size: full
        widgets:
          - type: monitor
            title: État des Services (Healthcheck)
            cache: 1m
            sites:
              - title: Vaultwarden
                url: http://vaultwarden:80
              - title: Actual Budget
                url: http://actual-budget:5006
              - title: Forgejo
                url: http://forgejo:3000
              - title: Grafana
                url: http://grafana:3000
              - title: Prometheus
                url: http://prometheus:9090
              - title: ntfy
                url: http://ntfy:80

          - type: rss
            title: Actualités Homelab & Open Source
            limit: 6
            collapse-after: 3
            cache: 6h
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st

      # Colonne 3 : Observabilité & Calendrier
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

          - type: bookmarks
            groups:
              - title: Observabilité
                links:
                  - title: Grafana
                    url: ${URL_GRAFANA}
                    description: Tableaux de bord & métriques
                  - title: Prometheus
                    url: ${URL_PROMETHEUS}
                    description: Collecte de métriques (interne)
                  - title: ntfy
                    url: ${URL_NTFY}
                    description: Alertes & notifications
