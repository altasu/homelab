# Configuration du Dashboard Homelab (Glance)
# Documentation : https://github.com/glanceapp/glance

theme:
  background-color: 220 15 13
  primary-color: 175 60 45

pages:
  - name: Homelab
    columns:
      # Colonne 1 : Calendrier & Raccourcis Externes (Documentation, Repositories)
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

          - type: bookmarks
            groups:
              - title: Dépôts & Documentation
                links:
                  - title: GitLab (Source of Truth)
                    url: https://gitlab.com/altasu/homelab
                    icon: si:gitlab
                    description: Dépôt principal & CI/CD
                  - title: Documentation IaC
                    url: https://homelab-ec5d79.gitlab.io/
                    icon: si:materialformkdocs
                    description: Site MkDocs publié
              - title: Passerelles & Sécurité
                links:
                  - title: Cloudflare Zero Trust
                    url: https://dash.cloudflare.com
                    icon: si:cloudflare
                    description: Console des tunnels
                  - title: Twingate Admin
                    url: https://twingate.com
                    icon: auto-invert si:twingate
                    description: Console Zero Trust SDN

      # Colonne 2 : Portail Centralisé des Services Homelab (Cartes Unifiées Santé + Liens)
      - size: full
        widgets:
          - type: monitor
            title: Services & Applications Homelab
            cache: 30s
            sites:
              - title: Vaultwarden
                icon: si:bitwarden
                url: ${URL_VAULTWARDEN}
                check-url: http://vaultwarden:80

              - title: Actual Budget
                icon: si:actualbudget
                url: ${URL_ACTUAL_BUDGET}
                check-url: http://actual-budget:5006

              - title: Forgejo
                icon: si:forgejo
                url: ${URL_FORGEJO}
                check-url: http://forgejo:3000

              - title: Cockpit
                icon: si:cockpit
                url: ${URL_COCKPIT}
                check-url: ${URL_COCKPIT}
                allow-insecure: true
                alt-status-codes:
                  - 401
                  - 403
                  - 302
                  - 301

              - title: Grafana
                icon: si:grafana
                url: ${URL_GRAFANA}
                check-url: http://grafana:3000

              - title: Prometheus
                icon: si:prometheus
                url: ${URL_PROMETHEUS}
                check-url: http://prometheus:9090

              - title: ntfy
                icon: di:ntfy
                url: ${URL_NTFY}
                check-url: http://ntfy:80

      # Colonne 3 : Actualités & Flux RSS
      - size: small
        widgets:
          - type: rss
            title: Actualités Homelab & Open Source
            limit: 8
            collapse-after: 4
            cache: 6h
            feeds:
              - url: https://selfh.st/rss/
                title: selfh.st
