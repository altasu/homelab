# Stage 3: Applications
# Ce fichier peut être arrêté/redémarré sans couper l'accès distant.
# Prérequis: infra/ et data/ doivent être actifs (homelab_net doit exister).
#
# Usage: podman-compose -f compose.yml up -d

services:
  vaultwarden:
    image: docker.io/vaultwarden/server:1.37.1-alpine
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      # Sécurité & Administration
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=false
      - WEBSOCKET_ENABLED=true
      # Connexion PostgreSQL (Data Tier)
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}
    volumes:
      # Fichiers statiques, pièces jointes, etc. (la DB est dans Postgres)
      - vaultwarden_data:/data
    networks:
      - homelab_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    # Pas de `ports:` — l'accès se fait uniquement via Cloudflare Tunnel (infra/)
    # Cloudflare route vers http://vaultwarden:80 via le réseau homelab_net partagé

networks:
  homelab_net:
    external: true

volumes:
  vaultwarden_data:

